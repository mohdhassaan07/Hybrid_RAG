[project]
name = "hybridrag"
version = "0.1.0"
description = "Hybrid RAG pipeline with multiple chunking strategies"
readme = "README.md"
authors = [
    { name = "mohdhassaan07", email = "mohdhassaan837@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-experimental>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-qdrant>=0.2",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
    "groq>=1.7.0",
    "fastapi>=0.160.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
