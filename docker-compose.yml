services:

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  seed:
    build: .
    command: python seed.py
    environment:
      QDRANT_URL: http://qdrant:6333
      BM25_INDEX_PATH: /app/data/bm25_index.pkl
    env_file:
      - .env
    volumes:
      - bm25_data:/app/data
    depends_on:
      - qdrant

  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      BM25_INDEX_PATH: /app/data/bm25_index.pkl
    env_file:
      - .env
    volumes:
      - bm25_data:/app/data
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build: .
    command: streamlit run dashboard.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
      QDRANT_URL: http://qdrant:6333
      BM25_INDEX_PATH: /app/data/bm25_index.pkl
    env_file:
      - .env
    volumes:
      - bm25_data:/app/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_data:
  bm25_data: